services:
  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    container_name: mariadb
    restart: on-failure
    networks:
      - inception_network
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    depends_on:
      - mariadb
    networks:
      - inception_network
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html

  nginx:
    image: nginx
    build: ./requirements/nginx
    container_name: nginx
    restart: on-failure
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_network
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html

  redis:
    image: redis
    build: ./requirements/bonus/redis
    container_name: redis
    restart: on-failure
    networks:
      - inception_network

  static_website:
    image: static_website
    build: ./requirements/bonus/static_website
    container_name: static_website
    restart: on-failure
    ports:
      - "8081:80"
    networks:
      - inception_network

  adminer:
    image: adminer
    build: ./requirements/bonus/adminer/
    container_name: adminer
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - inception_network

  cadvisor:
    image: cadvisor
    build: ./requirements/bonus/cadvisor
    container_name: cadvisor
    restart: on-failure
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs
      - /var/run:/var/run
      - /sys:/sys
      - /var/lib/docker:/var/lib/docker
    networks:
      - inception_network

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/mboulagh/data/mariadb_data

  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: /home/mboulagh/data/wordpress_data

networks:
  inception_network:
    driver: bridge